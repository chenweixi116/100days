return {k:k,el:el,cv:cv,geo:GEO[k],x:W/2,y:GY,dy:0,rot:0,sx:1,sy:1,z:2,w:100,h:100,ph:Math.random()*6,moving:false,hopping:false,zz:false,vis:true,art:null,mp:[50,62],skin:GEO[k].skin};

}

const G=newChar('g'),B=newChar('b');

function placeholder(k){

const S=300,c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');

const E=(x,y,rx,ry,col)=>{g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.283);g.fill()};

if(k==='g'){E(150,150,118,122,'#3a2a26');E(40,175,22,26,'#f0c8a8');E(260,175,22,26,'#f0c8a8');E(150,205,76,60,'#fce2ce');g.fillStyle='#3a2a26';g.fillRect(70,200,22,90);g.fillRect(208,200,22,90);E(150,262,36,30,'#2a2430');E(150,272,22,12,'#c23b6a')}

else{E(36,185,24,28,'#a8704c');E(264,185,24,28,'#a8704c');E(150,190,108,78,'#fdf0e8');E(150,100,112,60,'#1a1a22');E(150,264,40,32,'#2a2430')}

[[.42,.56],[.58,.56]].forEach(e=>E(e[0]*S,e[1]*S,9,19,'#111'));

g.strokeStyle='#b0463c';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(138,196);g.quadraticCurveTo(150,206,162,196);g.stroke();

return {cv:c,bx:0,by:0,bw:S,bh:S,mode:'alpha',OW:S,OH:S,ph:true};

}

function cut(img){

const OW=img.naturalWidth,OH=img.naturalHeight,sc=Math.min(1,640/Math.max(OW,OH));

const w=Math.max(1,Math.round(OW*sc)),h=Math.max(1,Math.round(OH*sc));

const c=document.createElement('canvas');c.width=w;c.height=h;

const g=c.getContext('2d');g.drawImage(img,0,0,w,h);

const res=(cv,bx,by,bw,bh,mode)=>({cv:cv,bx:bx,by:by,bw:bw,bh:bh,mode:mode,OW:w,OH:h});

let d;try{d=g.getImageData(0,0,w,h)}catch(e){return res(c,0,0,w,h,'multiply')}

const a=d.data,N=w*h,bgm=new Uint8Array(N);

const cs=[[1,1],[w-2,1],[1,h-2],[w-2,h-2]];

if(Math.max.apply(null,cs.map(p=>a[(p[1]*w+p[0])*4+3]))<20){for(let k=0;k<N;k++)bgm[k]=a[k*4+3]<16?1:0}

else{

const nb=(k,mn,df)=>{const i=k*4,r=a[i],g1=a[i+1],b=a[i+2];const lo=Math.min(r,g1,b),hi=Math.max(r,g1,b);return lo>=mn&&hi-lo<=df};

const stk=[];

const push=k=>{if(!bgm[k]&&nb(k,196,10)){bgm[k]=1;stk.push(k)}};

for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}

for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}

while(stk.length){const k=stk.pop(),x=k%w,y=(k/w)|0;if(x>0)push(k-1);if(x<w-1)push(k+1);if(y>0)push(k-w);if(y<h-1)push(k+w)}

const add=[];

for(let k=0;k<N;k++){if(bgm[k])continue;const x=k%w,y=(k/w)|0;if(((x>0&&bgm[k-1])||(x<w-1&&bgm[k+1])||(y>0&&bgm[k-w])||(y<h-1&&bgm[k+w]))&&nb(k,180,16))add.push(k)}

add.forEach(k=>{bgm[k]=1});

}

let cnt=0,mnx=w,mny=h,mxx=-1,mxy=-1;

for(let k=0;k<N;k++){if(bgm[k]){cnt++}else{const x=k%w,y=(k/w)|0;if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y}}

if(cnt>N*.97||cnt<N*.05||mxx-mnx<w*.25||mxy-mny<h*.25)return res(c,0,0,w,h,'multiply');

for(let k=0;k<N;k++){if(bgm[k])a[k*4+3]=0}

g.putImageData(d,0,0);

const bx=Math.max(0,mnx-2),by=Math.max(0,mny-2);

return res(c,bx,by,Math.min(w,mxx+3)-bx,Math.min(h,mxy+3)-by,'alpha');

}

function applyArt(c,art){

c.art=art;const q=c.geo;

c.w=W*q.w;c.h=c.w*art.bh/art.bw;

c.el.style.width=c.w+'px';c.el.style.height=c.h+'px';

c.cv.width=art.bw;c.cv.height=art.bh;

c.cv.getContext('2d').drawImage(art.cv,art.bx,art.by,art.bw,art.bh,0,0,art.bw,art.bh);

c.el.style.mixBlendMode=art.mode==='multiply'?'multiply':'normal';

c.mp=[(q.mouth[0]*art.OW-art.bx)/art.bw*100,(q.mouth[1]*art.OH-art.by)/art.bh*100];

}

let pending=2;

function done(){pending--;if(pending<=0)th.textContent='点一下，开始 ▶'}

function loadAny(c,list,i){

i=i||0;

if(i>=list.length){if(!c.art||!c.art.ph)applyArt(c,placeholder(c.k));done();return}

const im=new Image();

im.onload=()=>{try{applyArt(c,cut(im))}catch(e){applyArt(c,placeholder(c.k))}done()};

im.onerror=()=>loadAny(c,list,i+1);

im.src=list[i];

}

function loadOne(c,src,lab){

const im=new Image();

im.onload=()=>{try{const art=cut(im);applyArt(c,art);if($('fs'))$('fs').textContent=lab+(art.mode==='alpha'?'：去底成功':'：去底失败，用了备用方式')}catch(e){applyArt(c,placeholder(c.k))}};

im.src=src;

}

function mouthXY(c){return {x:c.x-c.w/2+c.mp[0]/100*c.w,y:c.y-c.h+c.mp[1]/100*c.h}}

function seatY(c,my){return my+c.h*(1-c.mp[1]/100)}

const HC=['#ff8fb0','#ff6b98','#ffb3c8'];

function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s*1.1,y-s*.3,x-s*.5,y-s*1.1,x,y-s*.45);g.bezierCurveTo(x+s*.5,y-s*1.1,x+s*1.1,y-s*.3,x,y+s*.35);g.closePath();g.fill()}

function spark(g,x,y,s){g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x,y,x+s,y);g.quadraticCurveTo(x,y,x,y+s);g.quadraticCurveTo(x,y,x-s,y);g.quadraticCurveTo(x,y,x,y-s);g.closePath();g.fill()}

const PT=[];

function addH(x,y,n,big){for(let i=0;i<n;i++)PT.push({k:'h',x:x+(Math.random()-.5)*50,y:y+Math.random()*10,vx:(Math.random()-.5)*.6,vy:-.6-Math.random()*.9,l:1,s:(big?12:7)+Math.random()*6,c:HC[i%3]})}

function addS(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283;PT.push({k:'s',x:x,y:y,vx:Math.cos(a)*1.1,vy:Math.sin(a)*1.1-.4,l:1,s:6+Math.random()*5})}}

function addF(x,y,col){for(let i=0;i<34;i++){const a=i/34*6.283,sp=1.2+Math.random()*2.2;PT.push({k:'p',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:col,s:2+Math.random()*1.5})}}

function drawPT(g,t){

for(let i=PT.length-1;i>=0;i--){const p=PT[i];

p.x+=p.vx;p.y+=p.vy;

if(p.k==='p'){p.vy+=.05;p.vx*=.985;p.l-=.014}else if(p.k==='h'){p.l-=.009;p.vx+=Math.sin(t/200+i)*.01}else p.l-=.02;

if(p.l<=0){PT.splice(i,1);continue}

g.globalAlpha=clamp(p.l*1.4,0,1);

if(p.k==='h'){g.fillStyle=p.c;heart(g,p.x,p.y,p.s)}

else if(p.k==='s'){g.fillStyle='#ffd95a';spark(g,p.x,p.y,p.s)}

else{g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s*p.l+.6,0,6.283);g.fill()}

}

g.globalAlpha=1;

[G,B].forEach(c=>{if(!c.zz)return;for(let k=0;k<3;k++){const ph=((t/1800)+k/3)%1;g.globalAlpha=1-ph;g.fillStyle='#7b6fd0';g.font='italic 700 '+(14+k*5)+'px sans-serif';g.fillText('Z',c.x+c.w*.28+ph*22+k*5,c.y-c.h+8-ph*34-k*4)}});

g.globalAlpha=1;

}

const FD={v:0},DM={v:0};

function frame(t){

for(let i=TW.length-1;i>=0;i--){const w=TW[i];const p=clamp((t-w.t0)/w.ms,0,1);w.o[w.k]=w.f+(w.to-w.f)*w.e(p);if(p>=1){TW.splice(i,1);w.r()}}

[G,B].forEach(c=>{

const hop=c.moving?Math.abs(Math.sin(t/130))*11:c.hopping?Math.abs(Math.sin(t/170))*18:0;

const sway=Math.sin(t/900+c.ph)*(c.zz?2:1.2);

const brt=c.zz?Math.sin(t/650+c.ph)*.018:0;

c.el.style.transform='translate('+(c.x-c.w/2)+'px,'+(c.y-c.h-hop+c.dy+Math.sin(t/600+c.ph)*1.5)+'px) rotate('+(c.rot+sway)+'deg) scale('+c.sx+','+(c.sy+brt)+')';

c.el.style.zIndex=c.z;c.el.style.display=c.vis?'block':'none';

});

bgx.clearRect(0,0,W,H);

if(scn){bgx.drawImage(scn.bg,0,0,W,H);if(scn.dyn)scn.dyn(bgx,t)}

fgx.clearRect(0,0,W,H);

if(scn&&scn.fg)scn.fg(fgx,t);

drawPT(fgx,t);

if(DM.v>0){fgx.fillStyle='rgba(18,22,70,'+DM.v+')';fgx.fillRect(0,0,W,H)}

fd.style.opacity=FD.v;

requestAnimationFrame(frame);

}

function bubble(c,text,ms){

const d=document.createElement('div');d.className='bub';d.textContent=text;lay.appendChild(d);

const w=d.offsetWidth;

d.style.left=clamp(c.x,w/2+8,W-w/2-8)+'px';d.style.top=(c.y-c.h-10)+'px';

setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity=0},ms||1500);

setTimeout(()=>d.remove(),(ms||1500)+350);

}

function wrap(t){

if(t.length<=13)return t;

const mid=t.length/2;let best=-1,bd=99;

for(let i=0;i<t.length-2;i++){if(t[i]==='，'&&Math.abs(i+1-mid)<bd){bd=Math.abs(i+1-mid);best=i+1}}

if(best<0)best=Math.ceil(mid);

return t.slice(0,best)+'\n'+t.slice(best);

}

async function say(text,hold){

ar.style.display='none';tx.textContent='';

const a=[...wrap(text)];

for(let i=1;i<=a.length;i++){tx.textContent=a.slice(0,i).join('');await wait(55)}

await wait(hold==null?900:hold);

}

function begin(name){

scn=SCN[name];PT.length=0;TW.length=0;lay.innerHTML='';DM.v=0;num.style.display='none';

[G,B].forEach(c=>{Object.assign(c,{x:W/2,y:GY,dy:0,rot:0,sx:1,sy:1,z:2,moving:false,hopping:false,zz:false,vis:true})});

CUP.on=false;BED.on=false;

card.style.display='block';tx.textContent='';ar.style.display='none';ttl.style.display='none';

}

bgj(async()=>{const cols=['#ff8fb0','#ffd95a','#7fd6ff','#c9a0ff'];for(let i=0;i<9;i++){addF(W*(.15+Math.random()*.7),60+Math.random()*(GY*.4),cols[i%4]);await wait(520)}});

const CHS=[ch0,ch1,ch2,ch3,ch4,ch5,ch6];

let idx=-1,busy=false;

function toTitle(){

async function next(){

ar.style.display='none';

idx++;

if(idx===0)startAudio();

try{
